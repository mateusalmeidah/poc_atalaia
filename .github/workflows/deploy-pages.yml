name: Deploy webdemo (GitHub Pages)

# Publica a pasta webdemo/ no GitHub Pages a cada push na branch principal.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato (apenas webdemo/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: webdemo

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
