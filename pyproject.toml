[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atalaia-governanca"
version = "0.1.0"
description = "PoC 0.1 - Motor determinístico de apoio à decisão LGPD/LAI (ATALAIA)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
atalaia-governanca = "atalaia_governanca.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
